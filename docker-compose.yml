version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: fl_ingest
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  web:
    build: .
#    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - .:/app
#      - ./uploads:/app/uploads
    ports:
      - "8000:8000"
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      PYTHONUNBUFFERED: "1"
      PYCHARM_DEBUG: "1"
      PYTHONPATH: /app     # не обязательно, но полезно явно
    depends_on:
      - db

  link-analyzer:
    build: ./link_analyzer
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - default

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com  # поменяй на свой
      PGADMIN_DEFAULT_PASSWORD: admin          # и этот пароль тоже
    ports:
      - "3030:80"   # в браузере будет http://localhost:3030
    depends_on:
      - db
    volumes:
      - ./pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
